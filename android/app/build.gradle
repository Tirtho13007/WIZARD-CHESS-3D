plugins {
    id 'com.android.application'
}

// Automatically remove any legacy package directory or temporary screenshots from previous commits
delete file("src/main/java/com/wizardchess3d")
delete file("src/main/assets/assets/aistudio")

def resolveKeystoreCredentials = { File ksFile ->
    def pass = System.getenv("KEYSTORE_PASSWORD") ?: "wizardchess123"
    def alias = System.getenv("KEY_ALIAS") ?: "wizardchess"
    if (ksFile != null && ksFile.exists()) {
        def candidates = [
            ["wizardchess123", "wizardchess"],
            ["arcanechess123", "arcanechess"]
        ]
        for (cand in candidates) {
            try {
                def ks = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
                ksFile.withInputStream { is -> ks.load(is, cand[0].toCharArray()) }
                if (ks.containsAlias(cand[1])) {
                    pass = cand[0]
                    alias = cand[1]
                    break
                }
            } catch (Throwable ignored) {
            }
        }
    }
    return [pass, alias]
}

android {
    namespace 'com.arcanechess3d.sanctum'
    compileSdk 34

    defaultConfig {
        applicationId "com.arcanechess3d.sanctum"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
    }

    androidResources {
        noCompress 'b64', 'glb', 'json', 'wasm'
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    signingConfigs {
        release {
            def ksFile = file("release-key.jks")
            def creds = resolveKeystoreCredentials(ksFile)
            storeFile ksFile
            storePassword creds[0]
            keyAlias creds[1]
            keyPassword System.getenv("KEY_PASSWORD") ?: creds[0]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    tasks.matching { it.name == "preBuild" }.configureEach {
        doFirst {
            delete file("src/main/java/com/wizardchess3d")
            delete file("src/main/assets/assets/aistudio")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    // Official Google AdMob SDK (Banner, Interstitial, Rewarded Video Ads)
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    // Official Unity Ads SDK 4.x (Dual-Network Mediation / Waterfall with AdMob)
    implementation 'com.unity3d.ads:unity-ads:4.12.2'
}

plugins {
    id 'com.android.application'
}

// Clean up any legacy package directory or temporary chat screenshots before Gradle evaluates sources
project.delete(project.file("src/main/java/com/wizardchess3d"))
project.delete(project.file("src/main/assets/assets/aistudio"))

android {
    namespace 'com.arcanechess3d.sanctum'
    compileSdk 34

    defaultConfig {
        applicationId "com.arcanechess3d.sanctum"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
    }

    androidResources {
        noCompress 'b64', 'glb', 'json', 'wasm'
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    signingConfigs {
        release {
            def ksFile = project.file("release-key.jks")
            def resolvedPass = System.getenv("KEYSTORE_PASSWORD") ?: "wizardchess123"
            def resolvedAlias = System.getenv("KEY_ALIAS") ?: "wizardchess"
            if (ksFile.exists()) {
                def candidates = [
                    ["wizardchess123", "wizardchess"],
                    ["arcanechess123", "arcanechess"]
                ]
                for (cand in candidates) {
                    java.io.FileInputStream fis = null
                    try {
                        def ks = java.security.KeyStore.getInstance(java.security.KeyStore.getDefaultType())
                        fis = new java.io.FileInputStream(ksFile)
                        ks.load(fis, cand[0].toCharArray())
                        if (ks.containsAlias(cand[1])) {
                            resolvedPass = cand[0]
                            resolvedAlias = cand[1]
                            break
                        }
                    } catch (Throwable ignored) {
                    } finally {
                        if (fis != null) {
                            try { fis.close() } catch (Throwable ignored) {}
                        }
                    }
                }
            }
            storeFile ksFile
            storePassword resolvedPass
            keyAlias resolvedAlias
            keyPassword System.getenv("KEY_PASSWORD") ?: resolvedPass
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    // Official Google AdMob SDK (Banner, Interstitial, Rewarded Video Ads)
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
    // Official Unity Ads SDK 4.x (Dual-Network Mediation / Waterfall with AdMob)
    implementation 'com.unity3d.ads:unity-ads:4.12.2'
}

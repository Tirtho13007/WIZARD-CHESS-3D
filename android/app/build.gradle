plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wizardchess3d.sanctum'
    compileSdk 34

    defaultConfig {
        applicationId "com.wizardchess3d.sanctum"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3.0"
    }

    androidResources {
        noCompress 'b64', 'glb', 'json', 'wasm'
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "wizardchess123"
            keyAlias System.getenv("KEY_ALIAS") ?: "wizardchess"
            keyPassword System.getenv("KEY_PASSWORD") ?: "wizardchess123"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    // Official Google AdMob SDK (Banner, Interstitial, Rewarded Video Ads)
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}

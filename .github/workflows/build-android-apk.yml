name: Build Native Android APK & AAB (with Unity Ads SDK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Web Dependencies & Build 3D Game Assets
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npx vite build

      - name: Bundle Built Game Assets into Native Android APK
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Generate Android Signing Keystore
        working-directory: ./android/app
        run: |
          if [ ! -f release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore release-key.jks \
              -alias arcanechess \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass arcanechess123 \
              -keypass arcanechess123 \
              -dname "CN=Arcane Chess 3D, OU=Games, O=Vantargo, L=Dhaka, S=Dhaka, C=BD"
          fi

      - name: Build Signed Native Android APK & Play Store AAB
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Ready-to-Install Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcaneChess3D-Native-Android-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/release-key.jks
